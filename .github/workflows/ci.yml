# CI déléguée au reusable workflow famille (dev-wpa-config).
# Les E2E (Playwright, sous-projet e2e/ isolé) tournent dans e2e.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-ci.yml@v3
    secrets: inherit
    with:
      run-e2e: false # les E2E vivent dans e2e.yml (sous-projet isolé)
