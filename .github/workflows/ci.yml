# CI déléguée au reusable workflow famille (dev-wpa-config).
# Les E2E (Playwright, sous-projet e2e/ isolé) tournent dans e2e.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-ci.yml@v3
    secrets: inherit
    with:
      run-e2e: false # les E2E vivent dans e2e.yml (sous-projet isolé)
      # Valeurs FACTICES pour la validation d'env (src/lib/env.ts échoue au
      # chargement du module sans elles) : le test unitaire de backend/mfa.ts
      # importe le client Supabase transitivement. Aucun test n'atteint le
      # réseau. Le vrai build déployé (deploy.yml) utilise les vars du dépôt.
      build-env: |
        VITE_SUPABASE_URL=https://placeholder.supabase.co
        VITE_SUPABASE_ANON_KEY=placeholder-anon-key-0000000000000000
