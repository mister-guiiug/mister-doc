# Déploiement GitHub Pages, délégué au réutilisable de la famille.
#
# CE FICHIER ÉTAIT ÉCRIT À LA MAIN jusqu'au 06/09/2026 — et il lui manquait
# ce que le réutilisable pose : le repli SPA `404.html` (un lien profond
# servait la page 404 de GitHub, relevé d'AMELIORATIONS.md), `required-env`
# (une variable vide partait en production sans un mot) et `VITE_BASE_PATH`
# déduit du nom du dépôt.
#
# PAS DE `concurrency` ICI : le réutilisable déclare déjà le sien (`group:
# pages`). Redoublé dans l'appelant, GitHub refuse le fichier AVANT de créer un
# seul job, sans autre message que « workflow file issue ».
#
# Les VITE_* viennent des `vars` du dépôt, jamais des `secrets` : Vite les
# copie dans le bundle, le secret ne masquerait que les journaux. La clé VAPID
# est PUBLIQUE, comme la clé anon ; sans elle, `pushConfigured()` est faux et
# l'opt-in aux notifications reste masqué en production — d'où sa présence
# dans `required-env`.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

jobs:
  deploy:
    uses: mister-guiiug/dev-pwa-config/.github/workflows/pwa-deploy.yml@v4
    with:
      use-base-path: true
      build-env: |
        VITE_PUBLIC_SITE_ORIGIN=https://${{ github.repository_owner }}.github.io
        VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
        VITE_VAPID_PUBLIC_KEY=${{ vars.VITE_VAPID_PUBLIC_KEY }}
      required-env: |
        VITE_SUPABASE_URL
        VITE_SUPABASE_ANON_KEY
        VITE_VAPID_PUBLIC_KEY
