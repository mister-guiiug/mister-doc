name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-node (registre GitHub Packages, scope @mister-guiiug) + npm ci.
      # npm ci : installe STRICTEMENT depuis package-lock.json (builds
      # reproductibles). Le lockfile inclut les binaires natifs Linux
      # (rollup/lightningcss/@tailwindcss-oxide) ET les helpers @emnapi (WASI),
      # donc l'install aboutit sur le runner Linux.
      - uses: mister-guiiug/dev-wpa-config/.github/actions/setup-pwa@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build
        env:
          VITE_BASE_PATH: /mister-doc/
          VITE_PUBLIC_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
