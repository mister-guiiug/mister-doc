<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      La Content-Security-Policy (défense en profondeur) est injectée par
      vite.config.ts (plugin `csp`) : en PROD, `script-src` n'autorise que
      'self' + le hash SHA-256 de CHAQUE script inline (pas de
      'unsafe-inline'). En DEV, 'unsafe-inline' est conservé pour le préambule
      Fast Refresh inline de @vitejs/plugin-react.
    -->

    <!-- Anti-FOUC : le script est injecté en tête de <head> au build par
         pwaSeoPlugin() (option themeBoot, @mister-guiiug/dev-pwa-config/
         theme-boot). Clé dwc_theme, avec migration depuis l'ancienne clé
         mister-doc:theme. Il partage sa lecture et sa validation avec
         `useTheme`/`ThemeProvider` : les deux ne peuvent plus diverger. -->

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/icon-192.png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Mister Doc" />
    <meta
      name="description"
      content="Planning de gardes hospitalier partagé : édition en temps réel, bourse aux gardes, vue mensuelle, compteurs de week-ends et d'heures par médecin."
    />
    <!-- SEO : URLs résolues au build par le plugin partagé (pwaSeoPlugin). -->
    <link rel="canonical" href="__SEO_HOME_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mister Doc" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta
      property="og:title"
      content="Mister Doc — planning de gardes des médecins"
    />
    <meta
      property="og:description"
      content="Planning de gardes hospitalier partagé : édition en temps réel, bourse aux gardes, vue mensuelle, compteurs de week-ends et d'heures par médecin."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Mister Doc — planning de gardes des médecins"
    />
    <meta
      name="twitter:description"
      content="Planning de gardes hospitalier partagé : édition en temps réel, bourse aux gardes, vue mensuelle, compteurs de week-ends et d'heures par médecin."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />
    <title>Mister Doc — planning de gardes des médecins</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
